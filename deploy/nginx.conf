# Nginx site for the warehouse system. The setup script replaces __DOMAIN__ and then runs Certbot, which adds the HTTPS parts.
limit_req_zone $binary_remote_addr zone=wms_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=wms_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 1m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # slow down PIN guessing at the front door (the app also locks accounts after repeated failures)
    location = /api/login {
        limit_req zone=wms_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        limit_req zone=wms_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }
}
